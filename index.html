<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>粉紅像素貪食蛇</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #16161d;
      font-family: system-ui, sans-serif;
      color: #fff;
      touch-action: none; /* 禁止手機誤觸縮放或移動畫面 */
    }

    /* 手機滿版容器 */
    #container {
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }

    #gameWrapper {
      padding: 12px;
      border-radius: 12px;
      background: #222433;
      box-shadow: 0 12px 24px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.1em;
      font-size: 22px;
      text-align: center;
    }

    canvas {
      image-rendering: pixelated;
      background: #11131d;
      border-radius: 6px;
      border: 2px solid #343853;
    }

    #btnStart {
      padding: 8px 18px;
      border: none;
      border-radius: 999px;
      background: #ff7ab8;
      color: #1a1020;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #hint {
      font-size: 14px;
      opacity: 0.8;
      color: #b5b9ff;
    }

    #score {
      font-weight: bold;
      color: #ff9ed2;
      font-size: 16px;
    }
  </style>
</head>


<body>
  <div id="container">
    <div id="gameWrapper">
      <h1>粉紅像素貪食蛇</h1>
      <div>分數：<span id="score">0</span></div>
      <canvas id="game" width="400" height="400"></canvas>
      <div id="hint">方向鍵 / 手機滑動操作</div>
      <button id="btnStart">開始遊戲</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const btnStart = document.getElementById("btnStart");

    const tileSize = 20;
    const tileCount = canvas.width / tileSize;
    const baseSpeed = 130;

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let running = false;
    let loopId = null;

    /* 初始化遊戲（靜態畫面） */
    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.innerHTML = score;

      placeFood();
      draw();
      running = false;
    }

    /* 設定隨機食物 */
    function placeFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount),
      };
    }

    /* 開始遊戲 */
    function startGame() {
      if (loopId) clearInterval(loopId);
      running = true;
      loopId = setInterval(gameTick, baseSpeed);
    }

    /* 遊戲主循環 */
    function gameTick() {
      direction = nextDirection;

      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y,
      };

      /* 撞牆 */
      if (newHead.x < 0 || newHead.x >= tileCount ||
          newHead.y < 0 || newHead.y >= tileCount) {
        return gameOver();
      }

      /* 撞到自己 */
      if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
        return gameOver();
      }

      snake.unshift(newHead);

      /* 吃到食物 */
      if (newHead.x === food.x && newHead.y === food.y) {
        score++;
        scoreEl.innerHTML = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    /* 遊戲結束 */
    function gameOver() {
      clearInterval(loopId);
      running = false;
      alert("遊戲結束！得分：" + score);
      btnStart.innerText = "重新開始";
      init();
    }

    /* 畫面重繪 */
    function draw() {
      ctx.fillStyle = "#11131d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      /* 格線 */
      ctx.strokeStyle = "#222538";
      for (let i = 0; i < tileCount; i++) {
        ctx.strokeRect(i * tileSize, 0, tileSize, canvas.height);
        ctx.strokeRect(0, i * tileSize, canvas.width, tileSize);
      }

      /* 食物 */
      ctx.fillStyle = "#c77dff";
      ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize, tileSize);

      /* 蛇 */
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#ffb3d9" : "#ff7ab8";
        ctx.fillRect(s.x * tileSize, s.y * tileSize, tileSize, tileSize);
      });
    }

    /* 鍵盤操作 */
    window.addEventListener("keydown", e => {
      if (!running) return;

      if (e.key === "ArrowUp" && direction.y !== 1) nextDirection = { x: 0, y: -1 };
      if (e.key === "ArrowDown" && direction.y !== -1) nextDirection = { x: 0, y: 1 };
      if (e.key === "ArrowLeft" && direction.x !== 1) nextDirection = { x: -1, y: 0 };
      if (e.key === "ArrowRight" && direction.x !== -1) nextDirection = { x: 1, y: 0 };
    });

    /* 手機滑動操作 */
    let startX = 0, startY = 0;
    canvas.addEventListener("touchstart", e => {
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
    });

    canvas.addEventListener("touchend", e => {
      if (!running) return;

      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
        if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
      } else {
        if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
      }
    });

    /* 按鈕 */
    btnStart.addEventListener("click", () => {
      init();
      startGame();
      btnStart.innerText = "重新開始";
    });

    init();
  </script>
</body>
</html>
