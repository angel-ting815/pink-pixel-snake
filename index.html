<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>粉紅像素貪食蛇</title>
  <style>
    body {
      background: #16161d;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 8px;
      letter-spacing: 0.1em;
      font-size: 22px;
    }

    #gameWrapper {
      padding: 12px 16px 16px;
      border-radius: 12px;
      background: #222433;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #infoBar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 14px;
      opacity: 0.9;
    }

    #score {
      font-weight: 600;
      color: #ff9ed2;
    }

    #hint {
      font-size: 12px;
      color: #b5b9ff;
    }

    canvas {
      image-rendering: pixelated;  /* 強調像素感 */
      border-radius: 6px;
      border: 2px solid #343853;
      background: #11131d;
    }

    #btnRestart {
      margin-top: 4px;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #ff7ab8;
      color: #1a1020;
      font-weight: 600;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s;
    }

    #btnRestart:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(255, 122, 184, 0.4);
      background: #ff8cc2;
    }

    #btnRestart:active {
      transform: translateY(1px);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <h1>粉紅像素貪食蛇</h1>
    <div id="infoBar">
      <div>分數：<span id="score">0</span></div>
      <div id="hint">使用方向鍵操作</div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <button id="btnRestart">重新開始</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const btnRestart = document.getElementById("btnRestart");

    // 遊戲設定
    const tileSize = 20;              // 每一格的像素大小（越大越有像素感）
    const tileCount = canvas.width / tileSize; // 400 / 20 = 20x20 格
    const baseSpeed = 130;            // 遊戲速度 (數字越小越快)

    // 蛇與食物狀態
    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let gameLoopId;

    function initGame() {
      // 初始蛇身（三節）
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 }
      ];

      direction = { x: 1, y: 0 };   // 右
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;

      placeFood();
      if (gameLoopId) clearInterval(gameLoopId);
      gameLoopId = setInterval(gameTick, baseSpeed);
    }

    function placeFood() {
      // 隨機位置，不能跟蛇身重疊
      while (true) {
        const x = Math.floor(Math.random() * tileCount);
        const y = Math.floor(Math.random() * tileCount);

        const onSnake = snake.some(seg => seg.x === x && seg.y === y);
        if (!onSnake) {
          food = { x, y };
          break;
        }
      }
    }

    function gameTick() {
      // 更新方向（避免同一 frame 連續反向）
      direction = nextDirection;

      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };

      // 撞牆判定
      if (
        newHead.x < 0 ||
        newHead.x >= tileCount ||
        newHead.y < 0 ||
        newHead.y >= tileCount
      ) {
        return gameOver();
      }

      // 撞到自己
      if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        return gameOver();
      }

      // 把新的頭放到陣列最前面
      snake.unshift(newHead);

      // 是否吃到食物
      if (newHead.x === food.x && newHead.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        placeFood();
      } else {
        // 沒吃到就移除尾巴（維持長度）
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(gameLoopId);
      // 小小閃爍一下做效果
      flashBoard(() => {
        alert("遊戲結束！你的分數是：" + score);
        initGame();
      });
    }

    function flashBoard(callback) {
      let count = 0;
      const maxFlash = 4;
      const flashInterval = setInterval(() => {
        count++;
        // 交替顏色
        if (count % 2 === 0) {
          draw("#2b1020");
        } else {
          draw();
        }
        if (count >= maxFlash) {
          clearInterval(flashInterval);
          callback && callback();
        }
      }, 80);
    }

    function draw(customBg) {
      // 背景
      ctx.fillStyle = customBg || "#11131d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 畫淡淡的格線，增加像素風棋盤感
      ctx.strokeStyle = "#222538";
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        // 垂直線
        ctx.beginPath();
        ctx.moveTo(i * tileSize + 0.5, 0);
        ctx.lineTo(i * tileSize + 0.5, canvas.height);
        ctx.stroke();

        // 水平線
        ctx.beginPath();
        ctx.moveTo(0, i * tileSize + 0.5);
        ctx.lineTo(canvas.width, i * tileSize + 0.5);
        ctx.stroke();
      }

      // 食物（對比色：螢光紫）
      ctx.fillStyle = "#c77dff";
      drawPixel(food.x, food.y);
      // 食物外框
      ctx.strokeStyle = "#f1e0ff";
      ctx.lineWidth = 2;
      drawPixelOutline(food.x, food.y);

      // 蛇身（粉紅色）
      snake.forEach((seg, index) => {
        const isHead = index === 0;

        // 主體
        ctx.fillStyle = isHead ? "#ffb3d9" : "#ff7ab8";
        drawPixel(seg.x, seg.y);

        // 外框
        ctx.strokeStyle = "#e05299";
        ctx.lineWidth = 2;
        drawPixelOutline(seg.x, seg.y);

        // 頭部再加個「眼睛像素」，更有角色感
        if (isHead) {
          ctx.fillStyle = "#2b1020";
          const px = seg.x * tileSize;
          const py = seg.y * tileSize;
          const eyeSize = 3;

          // 根據方向調整眼睛位置
          if (direction.x === 1) {
            // 往右
            ctx.fillRect(px + tileSize - eyeSize - 3, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 3, py + tileSize - eyeSize - 4, eyeSize, eyeSize);
          } else if (direction.x === -1) {
            // 往左
            ctx.fillRect(px + 3, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + 3, py + tileSize - eyeSize - 4, eyeSize, eyeSize);
          } else if (direction.y === -1) {
            // 往上
            ctx.fillRect(px + 4, py + 3, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 4, py + 3, eyeSize, eyeSize);
          } else if (direction.y === 1) {
            // 往下
            ctx.fillRect(px + 4, py + tileSize - eyeSize - 3, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 4, py + tileSize - eyeSize - 3, eyeSize, eyeSize);
          }
        }
      });
    }

    // 畫一個「像素方塊」
    function drawPixel(x, y) {
      ctx.fillRect(
        x * tileSize,
        y * tileSize,
        tileSize,
        tileSize
      );
    }

    // 畫出方塊外框，增加像素感
    function drawPixelOutline(x, y) {
      ctx.strokeRect(
        x * tileSize + 1,
        y * tileSize + 1,
        tileSize - 2,
        tileSize - 2
      );
    }

    // 鍵盤控制
    window.addEventListener("keydown", (e) => {
      const key = e.key;

      // 避免使用方向鍵時畫面捲動
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) {
        e.preventDefault();
      }

      // 根據目前方向，避免直接反向（例如往右不能直接往左）
      if (key === "ArrowUp" && direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      } else if (key === "ArrowDown" && direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      } else if (key === "ArrowLeft" && direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      } else if (key === "ArrowRight" && direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }
    });

    btnRestart.addEventListener("click", () => {
      initGame();
    });

    // 初始化
    initGame();
  </script>
</body>
</html>
