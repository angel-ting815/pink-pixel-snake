<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>粉紅像素貪食蛇</title>
  <style>
    body {
      background: #16161d;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 8px;
      letter-spacing: 0.1em;
      font-size: 22px;
    }

    #gameWrapper {
      padding: 12px 16px 16px;
      border-radius: 12px;
      background: #222433;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #infoBar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 14px;
      opacity: 0.9;
    }

    #score {
      font-weight: 600;
      color: #ff9ed2;
    }

    #hint {
      font-size: 12px;
      color: #b5b9ff;
    }

    canvas {
      image-rendering: pixelated;
      border-radius: 6px;
      border: 2px solid #343853;
      background: #11131d;
    }

    #btnStart {
      margin-top: 4px;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #ff7ab8;
      color: #1a1020;
      font-weight: 600;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s;
    }

    #btnStart:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(255, 122, 184, 0.4);
      background: #ff8cc2;
    }

    #btnStart:active {
      transform: translateY(1px);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <h1>粉紅像素貪食蛇</h1>
    <div id="infoBar">
      <div>分數：<span id="score">0</span></div>
      <div id="hint">使用方向鍵操作</div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <button id="btnStart">開始遊戲</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const btnStart = document.getElementById("btnStart");

    const tileSize = 20;
    const tileCount = canvas.width / tileSize;
    const baseSpeed = 130;

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let gameLoopId = null;
    let isRunning = false;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      placeFood();
      draw();           // 只畫畫面，不啟動移動
      isRunning = false;
    }

    function startGameLoop() {
      if (gameLoopId) clearInterval(gameLoopId);
      gameLoopId = setInterval(gameTick, baseSpeed);
      isRunning = true;
    }

    function placeFood() {
      while (true) {
        const x = Math.floor(Math.random() * tileCount);
        const y = Math.floor(Math.random() * tileCount);

        const onSnake = snake.some(seg => seg.x === x && seg.y === y);
        if (!onSnake) {
          food = { x, y };
          break;
        }
      }
    }

    function gameTick() {
      direction = nextDirection;

      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };

      if (
        newHead.x < 0 ||
        newHead.x >= tileCount ||
        newHead.y < 0 ||
        newHead.y >= tileCount
      ) {
        return gameOver();
      }

      if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        return gameOver();
      }

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(gameLoopId);
      gameLoopId = null;
      isRunning = false;
      flashBoard(() => {
        alert("遊戲結束！你的分數是：" + score);
        initGame();                 // 重設畫面，等玩家再按「重新開始」
        btnStart.textContent = "重新開始";
      });
    }

    function flashBoard(callback) {
      let count = 0;
      const maxFlash = 4;
      const flashInterval = setInterval(() => {
        count++;
        if (count % 2 === 0) {
          draw("#2b1020");
        } else {
          draw();
        }
        if (count >= maxFlash) {
          clearInterval(flashInterval);
          callback && callback();
        }
      }, 80);
    }

    function draw(customBg) {
      ctx.fillStyle = customBg || "#11131d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#222538";
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tileSize + 0.5, 0);
        ctx.lineTo(i * tileSize + 0.5, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tileSize + 0.5);
        ctx.lineTo(canvas.width, i * tileSize + 0.5);
        ctx.stroke();
      }

      ctx.fillStyle = "#c77dff";
      drawPixel(food.x, food.y);
      ctx.strokeStyle = "#f1e0ff";
      ctx.lineWidth = 2;
      drawPixelOutline(food.x, food.y);

      snake.forEach((seg, index) => {
        const isHead = index === 0;

        ctx.fillStyle = isHead ? "#ffb3d9" : "#ff7ab8";
        drawPixel(seg.x, seg.y);

        ctx.strokeStyle = "#e05299";
        ctx.lineWidth = 2;
        drawPixelOutline(seg.x, seg.y);

        if (isHead) {
          ctx.fillStyle = "#2b1020";
          const px = seg.x * tileSize;
          const py = seg.y * tileSize;
          const eyeSize = 3;

          if (direction.x === 1) {
            ctx.fillRect(px + tileSize - eyeSize - 3, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 3, py + tileSize - eyeSize - 4, eyeSize, eyeSize);
          } else if (direction.x === -1) {
            ctx.fillRect(px + 3, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + 3, py + tileSize - eyeSize - 4, eyeSize, eyeSize);
          } else if (direction.y === -1) {
            ctx.fillRect(px + 4, py + 3, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 4, py + 3, eyeSize, eyeSize);
          } else if (direction.y === 1) {
            ctx.fillRect(px + 4, py + tileSize - eyeSize - 3, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 4, py + tileSize - eyeSize - 3, eyeSize, eyeSize);
          }
        }
      });
    }

    function drawPixel(x, y) {
      ctx.fillRect(
        x * tileSize,
        y * tileSize,
        tileSize,
        tileSize
      );
    }

    function drawPixelOutline(x, y) {
      ctx.strokeRect(
        x * tileSize + 1,
        y * tileSize + 1,
        tileSize - 2,
        tileSize - 2
      );
    }

    window.addEventListener("keydown", (e) => {
      const key = e.key;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) {
        e.preventDefault();
      }

      if (!isRunning) return; // 還沒開始遊戲時，不要改方向

      if (key === "ArrowUp" && direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      } else if (key === "ArrowDown" && direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      } else if (key === "ArrowLeft" && direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      } else if (key === "ArrowRight" && direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }
    });

    btnStart.addEventListener("click", () => {
      // 每次按都重新開一局
      initGame();
      startGameLoop();
      btnStart.textContent = "重新開始";
    });

    // 第一次載入：只畫靜態的初始畫面
    initGame();
  </script>
</body>
</html>
