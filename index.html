<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>粉紅像素貪食蛇</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #16161d;
      font-family: system-ui, sans-serif;
      color: #fff;
      touch-action: none; /* 手機避免誤觸捲動縮放 */
    }

    #container {
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }

    #gameWrapper {
      padding: 12px 16px 16px;
      border-radius: 12px;
      background: #222433;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.1em;
      font-size: 22px;
      text-align: center;
    }

    #infoBar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 14px;
      opacity: 0.9;
    }

    #score {
      font-weight: 600;
      color: #ff9ed2;
    }

    #hint {
      font-size: 12px;
      color: #b5b9ff;
    }

    canvas {
      image-rendering: pixelated;
      border-radius: 6px;
      border: 2px solid #343853;
      background: #11131d;
      touch-action: none;

      /* 這兩行是重點：在手機上自動縮放，不會被裁掉 */
      width: min(400px, calc(100vw - 40px)); /* 最多 400px，手機就縮到螢幕寬度內 */
      height: auto;
      display: block;
    }


    #btnStart {
      margin-top: 4px;
      font-size: 15px;
      padding: 6px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #ff7ab8;
      color: #1a1020;
      font-weight: 600;
    }

    /* 手機搖桿外圈 */
    #joystick {
      position: fixed;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.25);
      pointer-events: none;
      display: none;
      z-index: 10;
    }

    /* 搖桿內圈（會跟著手指移動） */
    #joystick-handle {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 122, 184, 0.9);
      box-shadow: 0 0 10px rgba(255, 122, 184, 0.8);
      left: 36px; /* 讓預設在正中央 */
      top: 36px;
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="gameWrapper">
      <h1>粉紅像素貪食蛇</h1>
      <div id="infoBar">
        <div>分數：<span id="score">0</span></div>
        <div id="hint">電腦：方向鍵｜手機：按住螢幕拖曳搖桿</div>
      </div>
      <canvas id="game" width="400" height="400"></canvas>
      <button id="btnStart">開始遊戲</button>
    </div>
  </div>

  <!-- 搖桿 UI -->
  <div id="joystick">
    <div id="joystick-handle"></div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const btnStart = document.getElementById("btnStart");

    const joystick = document.getElementById("joystick");
    const joystickHandle = document.getElementById("joystick-handle");

    const tileSize = 20;
    const tileCount = canvas.width / tileSize;
    const baseSpeed = 130;

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let running = false;
    let loopId = null;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;

      placeFood();
      draw();
      running = false;
    }

    function startGameLoop() {
      if (loopId) clearInterval(loopId);
      running = true;
      loopId = setInterval(gameTick, baseSpeed);
    }

    function placeFood() {
      while (true) {
        const x = Math.floor(Math.random() * tileCount);
        const y = Math.floor(Math.random() * tileCount);
        const onSnake = snake.some(seg => seg.x === x && seg.y === y);
        if (!onSnake) {
          food = { x, y };
          break;
        }
      }
    }

    function gameTick() {
      direction = nextDirection;

      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };

      if (
        newHead.x < 0 ||
        newHead.x >= tileCount ||
        newHead.y < 0 ||
        newHead.y >= tileCount
      ) {
        return gameOver();
      }

      if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        return gameOver();
      }

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(loopId);
      running = false;
      alert("遊戲結束！你的分數是：" + score);
      btnStart.textContent = "重新開始";
      initGame();
    }

    function draw(customBg) {
      ctx.fillStyle = customBg || "#11131d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 棋盤格線
      ctx.strokeStyle = "#222538";
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tileSize + 0.5, 0);
        ctx.lineTo(i * tileSize + 0.5, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tileSize + 0.5);
        ctx.lineTo(canvas.width, i * tileSize + 0.5);
        ctx.stroke();
      }

      // 食物
      ctx.fillStyle = "#c77dff";
      drawPixel(food.x, food.y);
      ctx.strokeStyle = "#f1e0ff";
      ctx.lineWidth = 2;
      drawPixelOutline(food.x, food.y);

      // 蛇
      snake.forEach((seg, index) => {
        const isHead = index === 0;
        ctx.fillStyle = isHead ? "#ffb3d9" : "#ff7ab8";
        drawPixel(seg.x, seg.y);

        ctx.strokeStyle = "#e05299";
        ctx.lineWidth = 2;
        drawPixelOutline(seg.x, seg.y);

        if (isHead) {
          // 頭的眼睛
          ctx.fillStyle = "#2b1020";
          const px = seg.x * tileSize;
          const py = seg.y * tileSize;
          const eyeSize = 3;

          if (direction.x === 1) {
            // 右
            ctx.fillRect(px + tileSize - eyeSize - 3, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 3, py + tileSize - eyeSize - 4, eyeSize, eyeSize);
          } else if (direction.x === -1) {
            // 左
            ctx.fillRect(px + 3, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + 3, py + tileSize - eyeSize - 4, eyeSize, eyeSize);
          } else if (direction.y === -1) {
            // 上
            ctx.fillRect(px + 4, py + 3, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 4, py + 3, eyeSize, eyeSize);
          } else if (direction.y === 1) {
            // 下
            ctx.fillRect(px + 4, py + tileSize - eyeSize - 3, eyeSize, eyeSize);
            ctx.fillRect(px + tileSize - eyeSize - 4, py + tileSize - eyeSize - 3, eyeSize, eyeSize);
          }
        }
      });
    }

    function drawPixel(x, y) {
      ctx.fillRect(
        x * tileSize,
        y * tileSize,
        tileSize,
        tileSize
      );
    }

    function drawPixelOutline(x, y) {
      ctx.strokeRect(
        x * tileSize + 1,
        y * tileSize + 1,
        tileSize - 2,
        tileSize - 2
      );
    }

    // 鍵盤控制（電腦）
    window.addEventListener("keydown", (e) => {
      if (!running) return;
      const key = e.key;
      if (key === "ArrowUp" && direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      } else if (key === "ArrowDown" && direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      } else if (key === "ArrowLeft" && direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      } else if (key === "ArrowRight" && direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }
    });

    // 搖桿控制（手機／平板）
    let touchActive = false;
    let startX = 0;
    let startY = 0;
    const JOY_SIZE = 120;
    const HANDLE_SIZE = 48;
    const JOY_RADIUS = (JOY_SIZE - HANDLE_SIZE) / 2; // 搖桿可移動最大半徑（中心到內圈中心）

    function centerHandle() {
      const center = (JOY_SIZE - HANDLE_SIZE) / 2;
      joystickHandle.style.left = center + "px";
      joystickHandle.style.top = center + "px";
    }

    centerHandle();

    function handleDirection(dx, dy) {
      if (!running) return;
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // 太小就忽略

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && direction.x !== -1) {
          nextDirection = { x: 1, y: 0 };
        } else if (dx < 0 && direction.x !== 1) {
          nextDirection = { x: -1, y: 0 };
        }
      } else {
        if (dy > 0 && direction.y !== -1) {
          nextDirection = { x: 0, y: 1 };
        } else if (dy < 0 && direction.y !== 1) {
          nextDirection = { x: 0, y: -1 };
        }
      }
    }

    canvas.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      touchActive = true;
      startX = t.clientX;
      startY = t.clientY;

      // 顯示搖桿，中心在手指位置
      joystick.style.display = "block";
      joystick.style.left = startX + "px";
      joystick.style.top = startY + "px";
      joystick.style.marginLeft = "-60px";
      joystick.style.marginTop = "-60px";

      centerHandle();
    });

    canvas.addEventListener("touchmove", (e) => {
      if (!touchActive) return;
      e.preventDefault();

      const t = e.touches[0];
      let dx = t.clientX - startX;
      let dy = t.clientY - startY;

      // 限制在圓形範圍內
      const dist = Math.hypot(dx, dy);
      if (dist > JOY_RADIUS) {
        const scale = JOY_RADIUS / dist;
        dx *= scale;
        dy *= scale;
      }

      const center = (JOY_SIZE - HANDLE_SIZE) / 2;
      joystickHandle.style.left = center + dx + "px";
      joystickHandle.style.top = center + dy + "px";

      handleDirection(dx, dy);
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      touchActive = false;
      joystick.style.display = "none";
      centerHandle();
    });

    btnStart.addEventListener("click", () => {
      initGame();
      startGameLoop();
      btnStart.textContent = "重新開始";
    });

    // 初始畫面
    initGame();
  </script>
</body>
</html>
